plugins {
	id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
}

minecraft {
	mappings channel: mapping_channel, version: minecraft_version

	accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

	runs {
		configureEach {
			workingDirectory project.file('run')

			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'

			mods {
				chatmoderator {
					source sourceSets.main
				}
			}
		}

		client {
		}

		server {
			args '--nogui'
		}

		data {
			workingDirectory project.file('run-data')

			args '--mod', 'chatmoderator', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
		}
	}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
	implementation project(':core')
	minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

processResources {
	filesMatching('META-INF/mods.toml') {
		expand inputs.properties
	}
}

processTestResources {
	filesMatching('META-INF/mods.toml') {
		expand inputs.properties
	}
}

jar {
	finalizedBy 'reobfJar'
}
